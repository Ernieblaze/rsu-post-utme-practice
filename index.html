    <style>
      /* Launch splash — shown until React mounts into #root, then replaced. */
      #am-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
        background:radial-gradient(120% 90% at 50% 38%, #17335c 0%, #0a172b 70%);z-index:9999;animation:am-fade .4s ease both}
      #am-splash svg{width:96px;height:96px;animation:am-rise .5s cubic-bezier(.2,.8,.2,1) both}
      #am-splash .am-wm{font-family:'Sora',system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;color:#fff;animation:am-rise .5s .06s cubic-bezier(.2,.8,.2,1) both}
      #am-splash .am-wm b{color:#f4b400;font-weight:800}
      @keyframes am-fade{from{opacity:0}to{opacity:1}}
      @keyframes am-rise{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion: reduce){#am-splash,#am-splash svg,#am-splash .am-wm{animation:none}}
    </style>
